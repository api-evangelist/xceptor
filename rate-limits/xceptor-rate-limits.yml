method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Data Automation
  - Document Processing
description: Xceptor does not publish rate-limit documentation on its public web site or any
  unauthenticated developer portal. The REST API is exposed within a customer's deployed Xceptor
  environment; throttling is governed by the customer's deployment topology and the contractual
  capacity Xceptor provisions for that tenant rather than a vendor-published numeric ceiling.
sources:
  - https://www.xceptor.com/
limits:
  - name: Tenant / deployment-scoped throttling (not publicly documented)
    scope: tenant
    metric: varies
    limit: see customer deployment documentation
    notes: Xceptor's REST API runs inside a managed or customer-hosted Xceptor environment;
      effective limits are determined by the deployment's compute and capacity allocation, not
      by a vendor-published rate.
policies:
  - name: Documentation gating
    description: Xceptor publishes no public rate-limit policy. Operational limits are shared
      with customers as part of the implementation engagement.
  - name: Document-processing batch model
    description: Xceptor workloads are document-ingestion and reconciliation pipelines rather
      than per-second transactional reads; throughput is governed by ingest worker count and
      pipeline concurrency tuned per deployment.
  - name: Backoff
    description: Standard guidance is exponential backoff with jitter on HTTP 429 / 503
      responses, with retry budgets coordinated with the customer's Xceptor solution architect.
