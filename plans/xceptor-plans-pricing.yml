notes: Xceptor publishes no pricing pages, no plan tiers, and no rate-limit documentation. The
  REST API is delivered as part of a customer's deployed Xceptor environment rather than as a
  standalone product. Trimmed to a single Contact Sales plan pending direct vendor confirmation.
