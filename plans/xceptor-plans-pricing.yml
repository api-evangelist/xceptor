description: Xceptor is an enterprise data-automation platform sold to financial-services
  customers via direct sales and demo-led discovery. The vendor does not publish list pricing,
  free, or self-serve plans, and does not expose a public developer API portal; the only
  consumer-facing entry point is a "Schedule a Demo" / "Book a Demo" call-to-action on
  xceptor.com, with existing customers signing in at connect.xceptor.com.
sources:
