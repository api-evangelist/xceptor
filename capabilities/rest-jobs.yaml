naftiko: 1.0.0-alpha2
info:
  label: Xceptor REST API — Jobs
  description: 'Xceptor REST API — Jobs. 4 operations. Lead operation: Xceptor List Processing Jobs. Self-contained Naftiko
    capability covering one Xceptor business surface.'
  tags:
  - Xceptor
  - Jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    XCEPTOR_API_KEY: XCEPTOR_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-jobs
    baseUri: https://api.xceptor.com/v1
    description: Xceptor REST API — Jobs business capability. Self-contained, no shared references.
    resources:
    - name: jobs
      path: /jobs
      operations:
      - name: listjobs
        method: GET
        description: Xceptor List Processing Jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter jobs by processing status
        - name: type
          in: query
          type: string
          description: Filter jobs by processing type
        - name: created_after
          in: query
          type: string
          description: Filter jobs created after this date-time
        - name: created_before
          in: query
          type: string
          description: Filter jobs created before this date-time
      - name: createjob
        method: POST
        description: Xceptor Create Processing Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: jobs-jobId
      path: /jobs/{jobId}
      operations:
      - name: getjob
        method: GET
        description: Xceptor Get Job Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: canceljob
        method: DELETE
        description: Xceptor Cancel Processing Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.XCEPTOR_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-jobs-rest
    port: 8080
    description: REST adapter for Xceptor REST API — Jobs. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/jobs
      name: jobs
      description: REST surface for jobs.
      operations:
      - method: GET
        name: listjobs
        description: Xceptor List Processing Jobs
        call: rest-jobs.listjobs
        with:
          status: rest.status
          type: rest.type
          created_after: rest.created_after
          created_before: rest.created_before
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createjob
        description: Xceptor Create Processing Job
        call: rest-jobs.createjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobs/{jobid}
      name: jobs-jobid
      description: REST surface for jobs-jobId.
      operations:
      - method: GET
        name: getjob
        description: Xceptor Get Job Details
        call: rest-jobs.getjob
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: canceljob
        description: Xceptor Cancel Processing Job
        call: rest-jobs.canceljob
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Xceptor REST API — Jobs. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: xceptor-list-processing-jobs
      description: Xceptor List Processing Jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-jobs.listjobs
      with:
        status: tools.status
        type: tools.type
        created_after: tools.created_after
        created_before: tools.created_before
      outputParameters:
      - type: object
        mapping: $.
    - name: xceptor-create-processing-job
      description: Xceptor Create Processing Job
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-jobs.createjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: xceptor-get-job-details
      description: Xceptor Get Job Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-jobs.getjob
      outputParameters:
      - type: object
        mapping: $.
    - name: xceptor-cancel-processing-job
      description: Xceptor Cancel Processing Job
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: rest-jobs.canceljob
      outputParameters:
      - type: object
        mapping: $.
