naftiko: 1.0.0-alpha2
info:
  label: Xceptor REST API — Authentication
  description: 'Xceptor REST API — Authentication. 2 operations. Lead operation: Xceptor Create Access Token. Self-contained
    Naftiko capability covering one Xceptor business surface.'
  tags:
  - Xceptor
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    XCEPTOR_API_KEY: XCEPTOR_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-authentication
    baseUri: https://api.xceptor.com/v1
    description: Xceptor REST API — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: auth-token
      path: /auth/token
      operations:
      - name: createaccesstoken
        method: POST
        description: Xceptor Create Access Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: auth-token-revoke
      path: /auth/token/revoke
      operations:
      - name: revokeaccesstoken
        method: POST
        description: Xceptor Revoke Access Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.XCEPTOR_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-authentication-rest
    port: 8080
    description: REST adapter for Xceptor REST API — Authentication. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/auth/token
      name: auth-token
      description: REST surface for auth-token.
      operations:
      - method: POST
        name: createaccesstoken
        description: Xceptor Create Access Token
        call: rest-authentication.createaccesstoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/auth/token/revoke
      name: auth-token-revoke
      description: REST surface for auth-token-revoke.
      operations:
      - method: POST
        name: revokeaccesstoken
        description: Xceptor Revoke Access Token
        call: rest-authentication.revokeaccesstoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Xceptor REST API — Authentication. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: xceptor-create-access-token
      description: Xceptor Create Access Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-authentication.createaccesstoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: xceptor-revoke-access-token
      description: Xceptor Revoke Access Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-authentication.revokeaccesstoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
