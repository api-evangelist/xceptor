naftiko: 1.0.0-alpha2
info:
  label: Xceptor Document Upload API — Extraction
  description: 'Xceptor Document Upload API — Extraction. 2 operations. Lead operation: Xceptor Get extraction results. Self-contained
    Naftiko capability covering one Xceptor business surface.'
  tags:
  - Xceptor
  - Extraction
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    XCEPTOR_API_KEY: XCEPTOR_API_KEY
capability:
  consumes:
  - type: http
    namespace: document-upload-extraction
    baseUri: https://api.xceptor.com/v1
    description: Xceptor Document Upload API — Extraction business capability. Self-contained, no shared references.
    resources:
    - name: documents-documentId-extraction
      path: /documents/{documentId}/extraction
      operations:
      - name: getdocumentextraction
        method: GET
        description: Xceptor Get extraction results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: triggerextraction
        method: POST
        description: Xceptor Trigger document extraction
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.XCEPTOR_API_KEY}}'
  exposes:
  - type: rest
    namespace: document-upload-extraction-rest
    port: 8080
    description: REST adapter for Xceptor Document Upload API — Extraction. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/documents/{documentid}/extraction
      name: documents-documentid-extraction
      description: REST surface for documents-documentId-extraction.
      operations:
      - method: GET
        name: getdocumentextraction
        description: Xceptor Get extraction results
        call: document-upload-extraction.getdocumentextraction
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: triggerextraction
        description: Xceptor Trigger document extraction
        call: document-upload-extraction.triggerextraction
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: document-upload-extraction-mcp
    port: 9090
    transport: http
    description: MCP adapter for Xceptor Document Upload API — Extraction. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: xceptor-get-extraction-results
      description: Xceptor Get extraction results
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: document-upload-extraction.getdocumentextraction
      outputParameters:
      - type: object
        mapping: $.
    - name: xceptor-trigger-document-extraction
      description: Xceptor Trigger document extraction
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: document-upload-extraction.triggerextraction
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
