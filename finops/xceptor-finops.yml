providerId: xceptor
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Data Automation
  - Document Processing
  - Financial Services
description: FinOps shape for Xceptor is opaque. The platform is sold via direct enterprise
  sales with no public price list, usage API, or FOCUS-aligned cost export. Spend is recorded
  at the platform-subscription level rather than per-API-call.
sources:
  - https://www.xceptor.com/
notes: Xceptor publishes no pricing or usage-billing documentation. Meters and FOCUS columns
  reflect a single platform-subscription line until a customer engagement provides the
  invoice-line detail.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Xceptor Limited
serviceCategory: Data Automation Platform
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Xceptor
  ServiceCategory: Data Automation Platform
  ProviderName: Xceptor
  PublisherName: Xceptor Limited
  InvoiceIssuerName: Xceptor Limited
  BillingCurrency: USD
meters:
  - name: platform_subscription
    unit: month
    aggregation: sum
    dimensions:
      - tenant
principles:
  - name: Visibility
    description: Visibility into Xceptor consumption is exposed inside the deployed Xceptor
      tenant via its own pipeline-monitoring tools rather than a vendor-issued usage API.
  - name: Allocation
    description: Cost allocates to the business unit that owns the Xceptor subscription;
      per-pipeline or per-document attribution depends on internal Xceptor reporting.
  - name: Optimization
    description: Levers are pipeline-design choices (template reuse, batched ingestion,
      reconciliation rule consolidation) rather than rate or commitment discounts.
  - name: Accountability
    description: Subscription is owned by the operations / data-automation team; document-
      ingestion volume is owned by the upstream business processes that produce documents.
